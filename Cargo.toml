[workspace]
resolver = "2"
members = [
    "crates/nsqlite",
    "crates/nsqlite-capi",
    "crates/nsqlite-vector",
    "crates/nsqlited",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
